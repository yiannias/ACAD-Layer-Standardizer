[package]
name = "acad_layer_ffi"
version = "0.1.0"
edition = "2021"
description = "C-ABI cdylib interface for AutoCAD .NET P/Invoke integration"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acad_layer_core = { path = "../acad_layer_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
