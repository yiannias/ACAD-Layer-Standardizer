[package]
name = "acad_layer_ui"
version = "0.1.1"
edition = "2021"
description = "Spatial UI Kit frontend for AutoCAD Layer Standardizer"

[dependencies]
acad_layer_core = { path = "../acad_layer_core" }
acad_layer_ipc = { path = "../acad_layer_ipc" }
spatial-ui-kit = { path = "../../../../SpatialUiKit" }
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17.2"
